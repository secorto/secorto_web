name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Lint code
        run: pnpm run lint

      - name: Run unit tests with coverage
        run: pnpm exec vitest --run --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 30

  e2e-tests:
    name: E2E Tests (Playwright)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Wait for Netlify preview deploy (PR or main/master push)
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node packages/wait-netlify/src/wait-netlify-runner.js

      - name: Run Playwright tests
        env:
          HOME: /root
          NETLIFY_PREVIEW_URL: ${{ env.NETLIFY_PREVIEW_URL }}
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: "**/playwright-report/**"
          retention-days: 30
