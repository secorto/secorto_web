name: Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to run tests against (optional). NETLIFY_PREVIEW_URL takes priority if present"
        required: false
        default: "https://secorto.com"
      folder:
        description: "Folder to run (optional)"
        required: false
        default: ""
      tag:
        description: "Tag to run (optional)"
        required: false
        default: ""
      real_third_party:
        description: "Run tests against real third-party services"
        required: false
        default: false
        type: boolean

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    if: ${{ github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true

      - name: Lint code
        run: pnpm run lint

      - name: Run unit tests with coverage
        run: pnpm exec vitest --run --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 30

  e2e-tests:
    name: E2E Tests (Playwright)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true

      - name: Wait for Netlify preview deploy (PR or main/master push)
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec wait-netlify

      - name: Run Playwright tests (use Netlify preview if available)
        env:
          HOME: /root
          NETLIFY_PREVIEW_URL: ${{ env.NETLIFY_PREVIEW_URL }}
          BASE_URL: ${{ github.event.inputs.base_url }}
          FOLDER: ${{ github.event.inputs.folder }}
          TAG: ${{ github.event.inputs.tag }}
          REAL_THIRD_PARTY: ${{ github.event.inputs.real_third_party }}
        run: |
          if [ -n "$FOLDER" ] && [ -n "$TAG" ]; then
            pnpm run test:e2e -- --grep "$TAG" "tests/$FOLDER"
          elif [ -n "$FOLDER" ]; then
            pnpm run test:e2e -- "tests/$FOLDER"
          elif [ -n "$TAG" ]; then
            pnpm run test:e2e -- --grep "$TAG"
          else
            pnpm run test:e2e
          fi

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
