name: Publish Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '¿Qué tipo de incremento vas a lanzar?'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write  # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: false

      - name: Create Release Branch and Bump
        id: git_setup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

          # Hacemos el bump de los package.json
          pnpm -r version ${{ github.event.inputs.version }} --no-git-tag-version

          VERSION_CLEAN=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION_CLEAN" >> $GITHUB_ENV

          BRANCH_NAME="release/v$VERSION_CLEAN"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          # Nos cambiamos a la nueva rama de release
          git checkout -b $BRANCH_NAME

      - name: Build package
        run: pnpm build

      - name: Generate Notes, Commit and Create GitHub Release
        run: |
          # Generamos el changelog automático basado en master y lo guardamos en un archivo
          gh release notes "v${{ env.VERSION }}" --target "master" > changelog.txt

          # Estructuramos el mensaje del commit: Título + Notas de la Release
          echo "chore: bump version to ${{ env.VERSION }}" > commit_msg.txt
          echo "" >> commit_msg.txt
          cat changelog.txt >> commit_msg.txt

          # Hacemos el commit usando el archivo generado y empujamos la rama
          git add "packages/**/package.json" package.json
          git commit -F commit_msg.txt
          git push origin "${{ env.BRANCH_NAME }}"

          # Creamos la GitHub Release oficial usando las mismas notas guardadas
          gh release create "v${{ env.VERSION }}" \
            --title "Release v${{ env.VERSION }}" \
            --target "${{ env.BRANCH_NAME }}" \
            --notes-file changelog.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM
        run: pnpm -r --filter "./packages/**" stage publish

      - name: Open PR and Enable Auto-Merge
        run: |
          # Extraemos el changelog del archivo para ponerlo también en el cuerpo de la PR
          PR_URL=$(gh pr create \
            --title "chore: sync release v${{ env.VERSION }} to master" \
            --body-file changelog.txt \
            --base master \
            --head "${{ env.BRANCH_NAME }}")

          gh pr merge "$PR_URL" --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
