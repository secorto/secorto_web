name: Publish Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '¿Qué tipo de incremento vas a lanzar?'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write  # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Crucial para que 'gh' calcule el historial y las notas correctamente

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: false

      # =========================================================================
      # CICLO DE GIT ABSOLUTO (Notas -> Bump -> Commit Enriquecido -> Push -> Release)
      # =========================================================================
      - name: Generate Notes, Bump and Create GitHub Release
        id: release_core
        run: |
          # 1. Configurar identidad del Bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 2. CALCULAR NOTAS PRIMERO (Con el repositorio limpio apuntando a la rama por defecto remota)
          gh release notes "v-temp" --target "${{ github.event.repository.default_branch }}" > $HOME/changelog.txt

          # 3. BUMP: pnpm reescribe los package.json localmente
          pnpm -r version ${{ github.event.inputs.version }} --no-git-tag-version

          # 4. LEER VERSIÓN DEFINITIVA: Extraemos el número real que escribió pnpm
          VERSION_CLEAN=$(node -p "require('./package.json').version")
          BRANCH_NAME="release/v$VERSION_CLEAN"

          echo "VERSION=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          # 5. CREAR RAMA LOCAL: Nos movemos a la rama release
          git checkout -b "$BRANCH_NAME"

          # 6. COMMIT ENRIQUECIDO: Mensaje inyectando el changelog del paso 2
          echo "chore: bump version to $VERSION_CLEAN" > commit_msg.txt
          echo "" >> commit_msg.txt
          cat $HOME/changelog.txt >> commit_msg.txt

          # 7. INDEXAR Y PUSH: Usando tus rutas reales del monorrepo
          git add "packages/**/package.json" package.json
          git commit -F commit_msg.txt
          git push origin "$BRANCH_NAME"

          # 8. GITHUB RELEASE: Creamos la release oficial en la nube
          gh release create "v$VERSION_CLEAN" \
            --title "Release v$VERSION_CLEAN" \
            --target "$BRANCH_NAME" \
            --notes-file $HOME/changelog.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # CONSTRUCCIÓN Y PUBLICACIÓN EN NPM
      # =========================================================================
      - name: Build package
        run: pnpm build

      # Comando seguro 'stage publish' con NPM Provenance OIDC
      - name: Publish to NPM
        run: pnpm -r --filter "./packages/**" stage publish --provenance

      # =========================================================================
      # SINCRONIZACIÓN AUTOMÁTICA HACIA MASTER
      # =========================================================================
      - name: Open PR and Enable Auto-Merge
        run: |
          PR_URL=$(gh pr create \
            --title "chore: sync release v${{ env.VERSION }} to master" \
            --body-file $HOME/changelog.txt \
            --base master \
            --head "${{ env.BRANCH_NAME }}")

          gh pr merge "$PR_URL" --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
